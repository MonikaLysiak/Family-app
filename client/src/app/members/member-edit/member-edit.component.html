<div class="w-75 mx-auto">
    <div class="row" *ngIf="member">
        <!-- Profile Heading -->
        <div class="col-12 text-center mb-4">
            <h1 class="display-4">Your Profile</h1>
        </div>

        <!-- Profile Information -->
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="card text-center">
                <!-- Profile Image -->
                <img src="{{member.photoUrl || './assets/user.png'}}" alt="{{member.nickname}}" class="card-img-top img-thumbnail mx-auto mt-3" style="max-width: 150px; max-height: 150px;">
                <div class="card-body">
                    <div class="row">
                        <!-- Left Column -->
                        <div class="col-6 text-left">
                            <div>
                                <strong>Imię:</strong>
                                <p>{{member.name}}</p>
                            </div>
                            <div>
                                <strong>Nazwisko:</strong>
                                <p>{{member.surname}}</p>
                            </div>
                            <div>
                                <strong>Nazwa użytkownika:</strong>
                                <p>{{member.userName}}</p>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="col-6 text-left">
                            <div>
                                <strong>Wiek:</strong>
                                <p>{{member.age}}</p>
                            </div>
                            <div>
                                <strong>Data dołączenia:</strong>
                                <p>{{member.created | date: 'longDate'}}</p>
                            </div>
                            <div class="text-center">
                                <label>
                                    <input type="checkbox" (change)="setTwoFactorEnabled($event)" />
                                    Enable Two-Factor Authentication
                                  </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Photos Tab -->
        <div class="col-lg-8 col-md-6">
            <tabset class="member-tabset">
                <tab heading="Edit Photos">
                    <app-photo-edytor [member]="member"></app-photo-edytor>
                </tab>
            </tabset>
        </div>
    </div>
</div>
