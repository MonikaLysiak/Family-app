<div class="container">
    <div class="row">
        <!-- Add Photos Section -->
        <div class="col-md-6">
            <h4 class="mb-3">Add Photos</h4> <!-- Reduced heading size -->
            <div ng2FileDrop
                 [ngClass]="{'nv-file-over': hasBaseDropZoneOver}"
                 (fileOver)="fileOverBase($event)"
                 [uploader]="uploader"
                 class="card bg-faded p-2 text-center my-drop-zone"
                 style="height: 100px; font-size: 14px;">
                <i class="fa fa-upload fa-2x mb-2"></i> <!-- Smaller icon -->
                <p>Drop photos here</p>
            </div>
            <div class="mt-2">
                <label for="multi-file" class="form-label">Multiple Files</label>
                <input id="multi-file" type="file" ng2FileSelect [uploader]="uploader" multiple class="form-control form-control-sm" />
                
                <label for="single-file" class="form-label mt-2">Single File</label>
                <input id="single-file" type="file" ng2FileSelect [uploader]="uploader" class="form-control form-control-sm" />
            </div>
        </div>

        <!-- Upload Queue Section -->
        <div class="col-md-6" *ngIf="uploader?.queue?.length">
            <h4 class="mb-3">Upload Queue</h4> <!-- Reduced heading size -->
            <p>Queue length: {{ uploader?.queue?.length }}</p>
            <table class="table table-sm table-striped"> <!-- Smaller table -->
                <thead>
                    <tr>
                        <th width="70%">File Name</th>
                        <th>Size (MB)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of uploader?.queue">
                        <td><strong>{{ item?.file?.name }}</strong></td>
                        <td *ngIf="uploader?.options?.isHTML5">{{ item?.file?.size / 1024 / 1024 | number:'.2' }}</td>
                    </tr>
                </tbody>
            </table>

            <!-- Progress and Action Buttons -->
            <div class="d-flex align-items-center mb-2">
                <span>Queue progress:</span>
                <div class="progress w-100 ml-2">
                    <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': uploader?.progress + '%' }"></div>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-success btn-sm"
                        (click)="uploader?.uploadAll()" 
                        [disabled]="!uploader?.getNotUploadedItems()?.length">
                    <i class="fa fa-upload"></i> Upload all
                </button>
                <button type="button" class="btn btn-warning btn-sm"
                        (click)="uploader?.cancelAll()" 
                        [disabled]="!uploader?.isUploading">
                    <i class="fa fa-ban"></i> Cancel all
                </button>
                <button type="button" class="btn btn-danger btn-sm"
                        (click)="uploader?.clearQueue()" 
                        [disabled]="!uploader?.queue?.length">
                    <i class="fa fa-trash"></i> Remove all
                </button>
            </div>
        </div>
    </div>

    <!-- Family Photos Section -->
    <div class="row mt-5" *ngIf="family">
        <div class="col-12">
            <h4 class="mb-3">Family Photos</h4> <!-- Reduced heading size -->
            <div class="row">
                <div class="col-4 col-sm-3 col-md-2 mb-3" *ngFor="let photo of family.familyPhotos">
                    <div class="card">
                        <img src="{{photo.url}}" alt="photo of user" class="card-img-top img-thumbnail">
                        <div class="card-body d-flex justify-content-center">
                            <button class="btn btn-sm mx-2" 
                                    [disabled]="photo.isMain" 
                                    (click)="setMainPhoto(photo)"
                                    [ngClass]="photo.isMain ? 'btn-success active' : 'btn-outline-success'">
                                Main
                            </button>
                            <button class="btn btn-sm btn-danger mx-2" 
                                    [disabled]="photo.isMain" 
                                    (click)="deletePhoto(photo.id)">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
